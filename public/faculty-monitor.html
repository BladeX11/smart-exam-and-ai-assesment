<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Proctoring Monitor - SmartAssess AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Lexend', sans-serif; background-color: #f6f6f8; }
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 1rem; padding: 1.25rem; }
        .activity-feed { width: 350px; background: white; border-left: 1px solid #e2e8f0; height: 100vh; position: sticky; top: 0; }
        .badge { border-radius: 9999px; padding: 0.125rem 0.5rem; font-size: 0.65rem; font-weight: 700; }
        .badge-low { background-color: #dcfce7; color: #15803d; }
        .badge-medium { background-color: #fef3c7; color: #b45309; }
        .badge-high { background-color: #fee2e2; color: #b91c1c; }
        .ati-bar { height: 4px; border-radius: 2px; }
        .primary-btn { background-color: #135bec; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <!-- Main Monitor Area -->
    <main class="flex-1 p-8 overflow-y-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Live Exam Monitor</h1>
                <p id="examTitle" class="text-sm text-slate-500">Exam: Loading...</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-white border border-slate-200 rounded-xl px-4 py-2 flex items-center gap-6">
                    <div class="text-center">
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Active</p>
                        <p id="statActive" class="text-lg font-bold text-[#135bec]">0</p>
                    </div>
                    <div class="text-center">
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Suspicious</p>
                        <p id="statSuspicious" class="text-lg font-bold text-amber-500">0</p>
                    </div>
                    <div class="text-center">
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Critical</p>
                        <p id="statCritical" class="text-lg font-bold text-red-500">0</p>
                    </div>
                </div>
                <button id="forceEndAllBtn" class="primary-btn bg-red-500 hover:bg-red-600 px-4 py-2 rounded-xl text-white font-bold text-sm">Force End All</button>
            </div>
        </header>

        <!-- Student Grid -->
        <div id="studentGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            <!-- Student cards will be loaded here -->
            <div class="col-span-full py-20 text-center text-slate-400">
                <div class="animate-spin inline-block w-8 h-8 border-4 border-[#135bec] border-t-transparent rounded-full mb-4"></div>
                <p>Connecting to live proctoring feed...</p>
            </div>
        </div>
    </main>

    <!-- Right Activity Feed -->
    <aside class="activity-feed flex flex-col p-6">
        <h3 class="text-sm font-bold text-slate-800 mb-6 flex items-center gap-2">
            <span class="material-symbols-outlined text-[#135bec]">notifications</span> Live Activity Feed
        </h3>
        <div id="activityFeed" class="flex-1 overflow-y-auto space-y-4 pr-2">
            <!-- Activity items -->
        </div>
        <div class="mt-6 pt-6 border-t border-slate-100">
            <button class="w-full py-2 bg-slate-50 text-slate-500 rounded-xl text-xs font-bold hover:bg-slate-100">Clear Feed</button>
        </div>
    </aside>

    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 text-white px-6 py-3 rounded-xl shadow-2xl z-[300]"></div>

    <script src="/js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const examId = urlParams.get('id');
        if (!examId) window.location.href = '/faculty-dashboard.html';

        async function loadMonitor() {
            try {
                const exam = await api.exams.getDetails(examId);
                document.getElementById('examTitle').textContent = `Exam: ${exam.title}`;
                
                await fetchAttempts();
                startPolling();
                startActivityFeed();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function startActivityFeed() {
            setInterval(async () => {
                try {
                    const feed = document.getElementById('activityFeed');
                    const activities = await api.exams.getActivity(examId, 50);
                    
                    feed.innerHTML = '';
                    if (!activities.length) {
                        feed.innerHTML = '<div class="text-sm text-slate-400 text-center py-8">No activity has been recorded for this exam yet.</div>';
                        return;
                    }

                    activities.slice(0, 20).forEach(activity => {
                        const div = document.createElement('div');
                        const severityColors = {
                            'info': 'text-blue-600 bg-blue-50',
                            'warning': 'text-amber-600 bg-amber-50',
                            'critical': 'text-red-600 bg-red-50'
                        };
                        
                        const colorClass = severityColors[activity.severity] || severityColors['info'];
                        
                        div.className = `p-3 rounded-lg border border-slate-100 ${colorClass} ${activity.severity === 'critical' ? 'animate-pulse' : ''}`;
                        div.innerHTML = `
                            <div class="flex justify-between items-start mb-2">
                                <div class="flex-1">
                                    <p class="text-xs font-bold text-slate-400 uppercase mb-1">${formatActivityLabel(activity.activity_type)}</p>
                                    <p class="text-sm">${activity.description}</p>
                                    <p class="text-xs text-slate-400">${activity.student_name} • ${formatTimestamp(activity.timestamp)}</p>
                                </div>
                                ${activity.severity === 'critical' ? '<span class="material-symbols-outlined text-red-500">warning</span>' : ''}
                            </div>
                        `;
                        feed.appendChild(div);
                    });
                } catch (error) {
                    console.error('Activity feed error:', error);
                }
            }, 3000); // Update every 3 seconds
        }

        async function fetchAttempts() {
            try {
                const attempts = await api.exams.getAttempts(examId);
                renderStudentGrid(attempts);
                updateStats(attempts);
            } catch (err) {
                console.error('Failed to fetch attempts', err);
            }
        }

        function renderStudentGrid(attempts) {
            const grid = document.getElementById('studentGrid');
            if (attempts.length === 0) {
                grid.innerHTML = '<div class="col-span-full py-20 text-center text-slate-400">No students have started this exam yet.</div>';
                return;
            }
            grid.innerHTML = '';
            attempts.forEach(s => {
                const card = document.createElement('div');
                card.className = 'card flex flex-col';
                const risk = s.risk_level || 'low';
                const ati = Math.round(s.ati_score || 100);
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
                                <span class="material-symbols-outlined">person</span>
                            </div>
                            <div>
                                <h4 class="text-sm font-bold text-slate-800">${s.student_name}</h4>
                                <p class="text-[10px] text-slate-400">ID: STU-00${s.student_id}</p>
                            </div>
                        </div>
                        <span class="badge badge-${risk}">${risk.toUpperCase()} RISK</span>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-slate-50 p-2 rounded-lg text-center">
                            <p class="text-[10px] font-bold text-slate-400 uppercase">Status</p>
                            <p class="text-sm font-bold text-slate-700 capitalize">${s.status.replace('_', ' ')}</p>
                        </div>
                        <div class="bg-slate-50 p-2 rounded-lg text-center">
                            <p class="text-[10px] font-bold text-slate-400 uppercase">ATI Score</p>
                            <p class="text-sm font-bold ${ati >= 85 ? 'text-emerald-600' : (ati >= 60 ? 'text-amber-600' : 'text-red-600')}">${ati}%</p>
                        </div>
                    </div>

                    <div class="flex gap-2 mb-6">
                        <div class="flex-1 text-center">
                            <p class="text-[9px] font-bold text-slate-400 uppercase">Tabs</p>
                            <p class="text-xs font-bold ${s.tab_switches > 0 ? 'text-red-500' : 'text-slate-600'}">${s.tab_switches}</p>
                        </div>
                        <div class="flex-1 text-center">
                            <p class="text-[9px] font-bold text-slate-400 uppercase">Face</p>
                            <p class="text-xs font-bold ${s.face_violations > 0 ? 'text-red-500' : 'text-slate-600'}">${s.face_violations}</p>
                        </div>
                        <div class="flex-1 text-center">
                            <p class="text-[9px] font-bold text-slate-400 uppercase">Voice</p>
                            <p class="text-xs font-bold ${s.voice_violations > 0 ? 'text-red-500' : 'text-slate-600'}">${s.voice_violations}</p>
                        </div>
                    </div>

                    <div class="flex gap-2 mt-auto">
                        <button onclick="toggleStudentAttempt(${s.id}, '${s.status}')" class="flex-1 py-2 bg-slate-100 text-slate-600 rounded-lg text-[10px] font-bold hover:bg-slate-200">
                            ${s.status === 'in_progress' ? 'Pause' : 'Resume'}
                        </button>
                        <button onclick="forceEnd(${s.id})" class="flex-1 py-2 bg-red-50 text-red-600 rounded-lg text-[10px] font-bold hover:bg-red-100">Force End</button>
                        <button onclick="openChat(${s.student_id})" class="p-2 bg-blue-50 text-[#135bec] rounded-lg hover:bg-blue-100">
                            <span class="material-symbols-outlined text-sm">chat</span>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateStats(attempts) {
            document.getElementById('statActive').textContent = attempts.filter(s => s.status === 'in_progress').length;
            document.getElementById('statSuspicious').textContent = attempts.filter(s => s.risk_level === 'medium').length;
            document.getElementById('statCritical').textContent = attempts.filter(s => s.risk_level === 'high').length;
        }

        function startPolling() {
            setInterval(fetchAttempts, 5000);
        }

        async function forceEndAll() {
            if (!confirm('Force end ALL in-progress attempts for this exam?')) return;
            const btn = document.getElementById('forceEndAllBtn');
            try {
                btn.disabled = true;
                const attempts = await api.exams.getAttempts(examId);
                const inProgress = attempts.filter(a => a.status === 'in_progress');
                if (inProgress.length === 0) {
                    showToast('No in-progress attempts to end');
                    return;
                }
                await Promise.all(inProgress.map(a => api.attempts.submit(a.id, { force_reason: 'Force ended by faculty (all)' })));
                showToast(`Force ended ${inProgress.length} attempts`);
                fetchAttempts();
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        async function forceEnd(attemptId) {
            if (!confirm('Are you sure you want to force end this exam?')) return;
            try {
                await api.attempts.submit(attemptId, { force_reason: 'Force ended by faculty' });
                showToast('Exam terminated for student');
                fetchAttempts();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function toggleStudentAttempt(attemptId, currentStatus) {
            try {
                const newStatus = currentStatus === 'in_progress' ? 'paused' : 'in_progress';
                await api.attempts.updateStatus(attemptId, { status: newStatus });
                showToast(`Student exam ${newStatus === 'paused' ? 'paused' : 'resumed'}`, 'success');
                fetchAttempts();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function openChat(studentId) {
            window.location.href = `/faculty-messages.html?examId=${examId}&studentId=${studentId}`;
        }

        function formatActivityLabel(type) {
            return (type || 'activity').replace(/_/g, ' ');
        }

        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            if (Number.isNaN(date.getTime())) return 'Unknown time';

            const diffMs = Date.now() - date.getTime();
            const diffMinutes = Math.floor(diffMs / 60000);
            if (diffMinutes <= 0) return 'Just now';
            if (diffMinutes < 60) return `${diffMinutes} min ago`;

            const diffHours = Math.floor(diffMinutes / 60);
            if (diffHours < 24) return `${diffHours} hr ago`;

            return date.toLocaleString();
        }

        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.backgroundColor = type === 'error' ? '#ef4444' : '#1e293b';
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        window.onload = () => {
            document.getElementById('forceEndAllBtn').onclick = forceEndAll;
            loadMonitor();
        };
    </script>
</body>
</html>
