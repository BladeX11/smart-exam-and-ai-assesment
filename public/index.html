<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAssess AI - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Lexend', sans-serif; background-color: #f6f6f8; }
        .primary-btn { background-color: #135bec; color: white; border-radius: 0.75rem; font-weight: 700; transition: all 0.2s; }
        .primary-btn:hover { background-color: #0e46b3; box-shadow: 0 10px 15px -3px rgba(19, 91, 236, 0.2); }
        .input-field { background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 0.75rem 1rem; width: 100%; transition: all 0.2s; }
        .input-field:focus { outline: none; ring: 2px; ring-color: rgba(19, 91, 236, 0.2); border-color: #135bec; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
        <div class="p-8">
            <div class="flex items-center justify-center gap-2 mb-8">
                <span class="material-symbols-outlined text-4xl text-[#135bec]">shield_person</span>
                <h1 class="text-2xl font-bold text-slate-800">SmartAssess AI</h1>
            </div>

            <div id="loginForm">
                <h2 class="text-xl font-semibold mb-6 text-center">Welcome Back</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-slate-600 mb-1">Email Address</label>
                        <input type="email" id="email" class="input-field" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-slate-600 mb-1">Password</label>
                        <input type="password" id="password" class="input-field" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="w-full primary-btn py-3 mb-4">Sign In</button>
                </form>
                <p class="text-center text-sm text-slate-500">
                    Don't have an account? <a href="#" onclick="toggleForm()" class="text-[#135bec] font-semibold">Sign up</a>
                </p>
            </div>

            <div id="signupForm" class="hidden">
                <h2 class="text-xl font-semibold mb-6 text-center">Create Account</h2>
                <form onsubmit="handleSignup(event)">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-slate-600 mb-1">Full Name</label>
                        <input type="text" id="newName" class="input-field" placeholder="John Doe" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-slate-600 mb-1">Email Address</label>
                        <input type="email" id="newEmail" class="input-field" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-slate-600 mb-1">Password</label>
                        <input type="password" id="newPassword" class="input-field" placeholder="••••••••" required>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-slate-600 mb-1">Role</label>
                        <select id="newRole" class="input-field">
                            <option value="student">Student</option>
                            <option value="faculty">Faculty</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full primary-btn py-3 mb-4">Create Account</button>
                </form>
                <p class="text-center text-sm text-slate-500">
                    Already have an account? <a href="#" onclick="toggleForm()" class="text-[#135bec] font-semibold">Sign in</a>
                </p>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 text-white px-6 py-3 rounded-xl shadow-2xl z-50"></div>

    <script src="/js/api.js"></script>
    <script>
        function toggleForm() {
            document.getElementById('loginForm').classList.toggle('hidden');
            document.getElementById('signupForm').classList.toggle('hidden');
        }

        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.backgroundColor = type === 'error' ? '#ef4444' : '#1e293b';
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const data = await api.auth.login({ email, password });
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                showToast('Login successful! Redirecting...');
                setTimeout(() => {
                    window.location.href = data.user.role === 'faculty' ? '/faculty-dashboard.html' : '/student-dashboard.html';
                }, 1000);
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('newName').value;
            const email = document.getElementById('newEmail').value;
            const password = document.getElementById('newPassword').value;
            const role = document.getElementById('newRole').value;
            try {
                await api.auth.register({ name, email, password, role });
                showToast('Account created! Please sign in.');
                toggleForm();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // Check if already logged in
        window.onload = () => {
            const token = localStorage.getItem('token');
            let user = null;
            try {
                user = JSON.parse(localStorage.getItem('user') || 'null');
            } catch (_) {
                user = null;
            }

            if (token && user) {
                window.location.href = user.role === 'faculty' ? '/faculty-dashboard.html' : '/student-dashboard.html';
                return;
            }

            // Clean up partial/stale session values.
            if (!token || !user) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
            }
        };
    </script>
</body>
</html>
