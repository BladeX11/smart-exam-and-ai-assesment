<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - SmartAssess AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { font-family: 'Lexend', sans-serif; background-color: #f6f6f8; }
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 1rem; padding: 1.5rem; transition: all 0.2s; }
        .card:hover { border-color: #135bec; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
        .primary-btn { background-color: #135bec; color: white; border-radius: 0.75rem; font-weight: 700; padding: 0.75rem 1.5rem; transition: all 0.2s; }
        .primary-btn:hover { background-color: #0e46b3; box-shadow: 0 10px 15px -3px rgba(19, 91, 236, 0.2); }
        .badge { border-radius: 9999px; padding: 0.25rem 0.75rem; font-size: 0.75rem; font-weight: 700; }
        .badge-active { background-color: #dcfce7; color: #15803d; }
        .badge-scheduled { background-color: #dbeafe; color: #1d4ed8; }
    </style>
</head>
<body class="min-h-screen">
    <nav class="sticky top-0 bg-white/80 backdrop-blur-md border-b border-slate-200 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-3xl text-[#135bec]">shield_person</span>
                    <span class="text-xl font-bold text-slate-800">SmartAssess AI</span>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right hidden sm:block">
                        <p id="userName" class="text-sm font-semibold text-slate-800"></p>
                        <p id="userEmail" class="text-xs text-slate-500"></p>
                    </div>
                    <button onclick="handleLogout()" class="p-2 text-slate-400 hover:text-red-500 transition-colors">
                        <span class="material-symbols-outlined">logout</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="card flex items-center gap-4">
                <div class="p-3 bg-blue-50 rounded-xl text-[#135bec]">
                    <span class="material-symbols-outlined text-3xl">assignment</span>
                </div>
                <div>
                    <p class="text-sm text-slate-500">Total Exams</p>
                    <p id="totalExams" class="text-2xl font-bold text-slate-800">0</p>
                </div>
            </div>
            <div class="card flex items-center gap-4">
                <div class="p-3 bg-emerald-50 rounded-xl text-emerald-600">
                    <span class="material-symbols-outlined text-3xl">verified_user</span>
                </div>
                <div>
                    <p class="text-sm text-slate-500">Integrity Score</p>
                    <p id="integrityScore" class="text-2xl font-bold text-slate-800">100%</p>
                </div>
            </div>
            <div class="card flex items-center gap-4">
                <div class="p-3 bg-amber-50 rounded-xl text-amber-600">
                    <span class="material-symbols-outlined text-3xl">warning</span>
                </div>
                <div>
                    <p class="text-sm text-slate-500">Risk Level</p>
                    <p id="riskLevel" class="text-2xl font-bold text-slate-800">Clean</p>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-slate-800">Available Exams</h2>
            <div class="flex gap-2">
                <button class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm font-semibold hover:bg-slate-50">All</button>
                <button class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm font-semibold hover:bg-slate-50">Active</button>
            </div>
        </div>

        <div id="examList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Exams will be loaded here -->
            <div class="col-span-full py-20 text-center text-slate-400">
                <div class="animate-spin inline-block w-8 h-8 border-4 border-[#135bec] border-t-transparent rounded-full mb-4"></div>
                <p>Loading your exams...</p>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 text-white px-6 py-3 rounded-xl shadow-2xl z-50"></div>

    <script src="/js/api.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role !== 'student') window.location.href = '/index.html';

        document.getElementById('userName').textContent = user.name;
        document.getElementById('userEmail').textContent = user.email;

        async function loadDashboard() {
            try {
                const profile = await api.auth.getProfile();
                const atiValue = Number(profile.ati_score);
                const safeAti = Number.isFinite(atiValue) ? Math.round(atiValue) : 100;
                document.getElementById('totalExams').textContent = profile.total_exams_taken || 0;
                document.getElementById('integrityScore').textContent = safeAti + '%';
                document.getElementById('riskLevel').textContent = (profile.risk_level || 'clean').charAt(0).toUpperCase() + (profile.risk_level || 'clean').slice(1);
                
                const exams = await api.exams.getAll();
                const examList = document.getElementById('examList');
                examList.innerHTML = '';

                if (exams.length === 0) {
                    examList.innerHTML = '<div class="col-span-full py-20 text-center text-slate-400">No exams available at the moment.</div>';
                    return;
                }

                exams.forEach(exam => {
                    const card = document.createElement('div');
                    card.className = 'card flex flex-col justify-between';
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-4">
                                <span class="badge ${exam.status === 'active' ? 'badge-active' : 'badge-scheduled'}">
                                    ${(exam.status || 'draft').toUpperCase()}
                                </span>
                                <span class="text-xs text-slate-400 font-medium">${exam.duration_minutes} MINS</span>
                            </div>
                            <h3 class="text-lg font-bold text-slate-800 mb-2">${exam.title}</h3>
                            <p class="text-sm text-slate-500 mb-6 line-clamp-2">${exam.description || 'No description provided.'}</p>
                        </div>
                        <div class="flex items-center justify-between mt-auto">
                            <div class="flex items-center gap-1 text-slate-600">
                                <span class="material-symbols-outlined text-sm">database</span>
                                <span class="text-xs font-bold">${exam.total_marks} Marks</span>
                            </div>
                            <button onclick="startExam(${exam.id})" class="primary-btn text-sm py-2 px-4 ${exam.status !== 'active' ? 'opacity-50 cursor-not-allowed' : ''}" ${exam.status !== 'active' ? 'disabled' : ''}>
                                ${exam.status === 'active' ? 'Start Exam' : 'Locked'}
                            </button>
                        </div>
                    `;
                    examList.appendChild(card);
                });
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function startExam(examId) {
            try {
                // Check if exam is active
                const exams = await api.exams.getAll();
                const exam = exams.find(e => e.id === examId);
                
                if (!exam) {
                    showToast('Exam not found', 'error');
                    return;
                }
                
                if (exam.status !== 'active') {
                    showToast('Exam is not available yet', 'error');
                    return;
                }
                
                // Start or resume attempt
                const attempt = await api.attempts.start(examId);
                
                if (attempt.status === 'submitted' || attempt.status === 'force_ended') {
                    showToast('You have already completed this exam', 'info');
                    window.location.href = `/result.html?id=${attempt.id}`;
                    return;
                }
                
                if (attempt.status === 'paused') {
                    showToast('Resuming paused exam...', 'info');
                }
                
                // Redirect to exam with attempt and exam IDs
                window.location.href = `/student-exam.html?id=${attempt.id}&examId=${examId}`;
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function handleLogout() {
            localStorage.clear();
            window.location.href = '/index.html';
        }

        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.backgroundColor = type === 'error' ? '#ef4444' : '#1e293b';
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        window.onload = loadDashboard;
    </script>
</body>
</html>
